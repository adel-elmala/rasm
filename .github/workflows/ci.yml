name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only PR runs cancel older ones; every push to main gets a full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # vcpkg.json has no builtin-baseline, so this commit picks every dependency version.
  VCPKG_COMMIT: 4b77da7fed37817f124936239197833469f1b9a8
  # Windows only. The MSVC STL of Visual Studio 18 needs Clang 22 or newer.
  LLVM_VERSION: 22.1.8

jobs:
  # One job per OS runs both presets: they share the vcpkg packages, so they are built and cached once.
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, debug: x64-debug, release: x64-release }
          - { os: macos-latest, debug: macOS, release: macOS-release }
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@v4.4.5

      # The tests need no GPU, but rasm_tests.exe still loads vulkan-1.dll, so the runtime is installed too.
      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
          stripdown: true

      # rasm imports Vulkan 1.4 functions (vkCopyMemoryToImage), and Windows finds vulkan-1.dll in System32 before PATH.
      # The runner's System32 loader is older, so the SDK's loader replaces it, as a current GPU driver would.
      - name: Install the Vulkan loader
        if: runner.os == 'Windows'
        run: |
          sdk=$(cygpath -u "$VULKAN_SDK")/runtime/x64/vulkan-1.dll
          sys=/c/Windows/System32/vulkan-1.dll
          version() { powershell -NoProfile -Command "(Get-Item '$(cygpath -w "$1")').VersionInfo.FileVersion"; }
          echo "System32 before: $(version $sys 2>/dev/null || echo none)"
          cp -f "$sdk" "$sys"
          echo "System32 now:    $(version $sys)"
          test "$(version $sys)" = "$(version $sdk)"

      # The runner's MSVC STL needs a newer clang than the LLVM it ships, so a pinned one replaces it.
      - name: Install LLVM ${{ env.LLVM_VERSION }}
        if: runner.os == 'Windows'
        run: |
          choco upgrade llvm --version "$LLVM_VERSION" -y --no-progress
          found=$(clang++ --version | head -n 1)
          echo "$found"
          case "$found" in *"clang version $LLVM_VERSION"*) ;; *) echo "clang++ on PATH is not $LLVM_VERSION"; exit 1 ;; esac

      # clang++ finds the MSVC libraries and the Windows SDK through this environment.
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The key never matches exactly, so the newest cache is restored and a new one is saved when packages were built.
      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ github.run_id }}
          restore-keys: vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-

      # After msvc-dev-cmd, which points VCPKG_ROOT at the copy bundled with Visual Studio.
      - name: Set up vcpkg
        run: |
          root="$HOME/vcpkg"
          cache="$HOME/vcpkg-cache"
          git init "$root"
          git -C "$root" fetch --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_COMMIT"
          git -C "$root" checkout FETCH_HEAD
          mkdir -p "$cache"
          echo "VCPKG_CACHE_FILES=$(find "$cache" -type f | wc -l | tr -d ' ')" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$root/bootstrap-vcpkg.bat" -disableMetrics
            root=$(cygpath -m "$root")
            cache=$(cygpath -m "$cache")
          else
            "$root/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
          echo "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" >> "$GITHUB_ENV"

      - name: Configure ${{ matrix.debug }}
        run: cmake --preset ${{ matrix.debug }}

      - name: Build ${{ matrix.debug }}
        run: cmake --build --preset ${{ matrix.debug }}

      - name: Test ${{ matrix.debug }}
        run: ctest --preset ${{ matrix.debug }}

      # Release runs even when a debug step failed.
      - name: Configure ${{ matrix.release }}
        id: configure-release
        if: ${{ !cancelled() }}
        run: cmake --preset ${{ matrix.release }}

      - name: Build ${{ matrix.release }}
        id: build-release
        if: ${{ !cancelled() && steps.configure-release.outcome == 'success' }}
        run: cmake --build --preset ${{ matrix.release }}

      - name: Test ${{ matrix.release }}
        if: ${{ !cancelled() && steps.build-release.outcome == 'success' }}
        run: ctest --preset ${{ matrix.release }}

      # TEMPORARY probe of lavapipe (Mesa's CPU Vulkan driver) for the image tests. Removed before the PR is ready.
      - name: Restore Mesa cache
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/mesa
          key: mesa-26.3.0-c505fcc77e8f63a09d7ddac086591d2f542c0698d37fc9e3094685a34d0d9991

      - name: Probe lavapipe
        if: ${{ runner.os == 'Windows' && !cancelled() && steps.build-release.outcome == 'success' }}
        timeout-minutes: 40
        env:
          MESA_URL: https://github.com/pal1000/mesa-dist-win/releases/download/26.3.0/mesa3d-26.3.0-release-msvc.7z
          MESA_SHA256: c505fcc77e8f63a09d7ddac086591d2f542c0698d37fc9e3094685a34d0d9991
          LP_NATIVE_VECTOR_WIDTH: 256
        run: |
          mesa="$HOME/mesa"
          if [ ! -f "$mesa/mesa.7z" ]; then
            mkdir -p "$mesa"
            curl -sSfL -o "$mesa/mesa.7z" "$MESA_URL"
          fi
          echo "$MESA_SHA256  $mesa/mesa.7z" | sha256sum -c -
          rm -rf "$mesa/x"
          7z x -y -o"$mesa/x" "$mesa/mesa.7z" > /dev/null
          json=$(find "$mesa/x" -iname 'lvp_icd.x86_64.json' | head -n 1)
          echo "ICD: $json"; cat "$json"
          export VK_DRIVER_FILES=$(cygpath -w "$json")
          vi=$(find "$(cygpath -u "$VULKAN_SDK")" -iname 'vulkaninfo*.exe' | head -n 1)
          echo "vulkaninfo: $vi"
          echo "Layers: $(find "$(cygpath -u "$VULKAN_SDK")" -iname 'VkLayer_khronos_validation.json' | head -n 1)"
          echo "PROBE nproc=$(nproc)"; powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name"
          "$vi" --summary
          "$vi" --json -o lvp.json > /dev/null || true
          python - lvp.json <<'EOF'
          import json, sys
          d = json.load(open(sys.argv[1]))
          found = {}
          def walk(o, path):
              if isinstance(o, dict):
                  for k, v in o.items():
                      if k in WANT and not isinstance(v, (dict, list)):
                          found.setdefault(k, v)
                      if k in WANT and isinstance(v, list):
                          found.setdefault(k, v)
                      walk(v, path + [k])
              elif isinstance(o, list):
                  for v in o:
                      walk(v, path)
          WANT = ["apiVersion", "deviceName", "driverInfo", "hostImageCopy", "bufferDeviceAddress", "descriptorIndexing",
                  "timelineSemaphore", "dynamicRendering", "synchronization2", "drawIndirectCount", "storagePushConstant8",
                  "shaderInt8", "shaderInt64", "multiDrawIndirect", "drawIndirectFirstInstance", "samplerAnisotropy",
                  "shaderDrawParameters", "scalarBlockLayout", "hostQueryReset", "runtimeDescriptorArray",
                  "descriptorBindingPartiallyBound", "descriptorBindingVariableDescriptorCount",
                  "descriptorBindingSampledImageUpdateAfterBind", "descriptorBindingStorageImageUpdateAfterBind",
                  "shaderSampledImageArrayNonUniformIndexing", "textureCompressionBC", "textureCompressionETC2",
                  "textureCompressionASTC_LDR", "maxDescriptorSetUpdateAfterBindSampledImages",
                  "maxPerStageDescriptorUpdateAfterBindSampledImages", "maxDescriptorSetUpdateAfterBindStorageImages",
                  "maxPerStageDescriptorUpdateAfterBindStorageImages", "framebufferColorSampleCounts",
                  "framebufferDepthSampleCounts", "sampledImageColorSampleCounts", "sampledImageDepthSampleCounts",
                  "maxPushConstantsSize", "maxImageDimension2D", "maxBufferSize", "timestampPeriod", "maxComputeSharedMemorySize",
                  "alphaToOne", "independentBlend", "sampleRateShading", "depthClamp", "fillModeNonSolid", "wideLines"]
          walk(d, [])
          for k in WANT:
              print("PROBE %-50s %s" % (k, found.get(k, "MISSING")))
          exts = set()
          def walk_ext(o):
              if isinstance(o, dict):
                  for k, v in o.items():
                      if k == "extensions" and isinstance(v, dict):
                          exts.update(v.keys())
                      walk_ext(v)
          walk_ext(d)
          for e in ["VK_EXT_memory_budget", "VK_EXT_host_image_copy", "VK_KHR_swapchain"]:
              print("PROBE ext %-46s %s" % (e, e in exts))
          fmts = {}
          def walk_fmt(o):
              if isinstance(o, dict):
                  for k, v in o.items():
                      if k == "formats" and isinstance(v, dict):
                          fmts.update(v)
                      walk_fmt(v)
          walk_fmt(d)
          for f in ["R8G8B8A8_SRGB", "R8G8B8A8_UNORM", "R16G16B16A16_SFLOAT", "R32G32B32A32_SFLOAT", "R16G16_SFLOAT",
                    "B10G11R11_UFLOAT_PACK32", "BC7_SRGB_BLOCK", "BC7_UNORM_BLOCK", "BC5_UNORM_BLOCK", "BC4_UNORM_BLOCK",
                    "ETC2_R8G8B8A8_SRGB_BLOCK", "ASTC_4x4_SRGB_BLOCK", "D32_SFLOAT", "R32_SFLOAT", "R8_UNORM"]:
              p = fmts.get("VK_FORMAT_" + f)
              s = json.dumps(p) if p else ""
              print("PROBE fmt %-30s present=%s hostTransfer=%s sampled=%s filterLinear=%s" % (f, p is not None,
                    "HOST_IMAGE_TRANSFER" in s, "SAMPLED_IMAGE_BIT" in s, "FILTER_LINEAR" in s))
          EOF
          exe=build/x64-release/examples/16_headless.exe
          run() { local s=$(date +%s) rc=0; "$exe" --out "$1" > "$1.log" 2>&1 || rc=$?; echo "PROBE run $1 rc=$rc seconds=$(( $(date +%s) - s )) LP_NUM_THREADS=${LP_NUM_THREADS:-default}"; grep -iE "error|warn|valid|GPU|device|wrote|HDR" "$1.log" | head -n 40 || true; }
          mkdir -p probe
          run probe/a.png
          run probe/b.png
          LP_NUM_THREADS=1 run probe/t1.png
          LP_NUM_THREADS=2 run probe/t2.png
          for f in b t1 t2; do cmp -s probe/a.png probe/$f.png && echo "PROBE same a $f" || echo "PROBE DIFFERENT a $f"; done
          sha256sum probe/*.png

      - name: Upload the probe images
        if: ${{ runner.os == 'Windows' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lavapipe-probe
          path: probe/
          if-no-files-found: ignore

      - name: Check for new vcpkg packages
        id: vcpkg-packages
        if: ${{ !cancelled() }}
        run: |
          count=$(find "$HOME/vcpkg-cache" -type f | wc -l | tr -d ' ')
          if [ "$count" != "$VCPKG_CACHE_FILES" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Save vcpkg cache
        if: ${{ !cancelled() && steps.vcpkg-packages.outputs.changed == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
