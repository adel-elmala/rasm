name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only PR runs cancel older ones; every push to main gets a full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # vcpkg.json has no builtin-baseline, so this commit picks every dependency version.
  VCPKG_COMMIT: 4b77da7fed37817f124936239197833469f1b9a8
  # Windows only. The MSVC STL of Visual Studio 18 needs Clang 22 or newer.
  LLVM_VERSION: 22.1.8

jobs:
  # One job per OS runs both presets: they share the vcpkg packages, so they are built and cached once.
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, debug: x64-debug, release: x64-release }
          - { os: macos-latest, debug: macOS, release: macOS-release }
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@v4.4.5

      # The tests need no GPU, but rasm_tests.exe still loads vulkan-1.dll, so the runtime is installed too.
      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
          stripdown: true

      # rasm imports Vulkan 1.4 functions (vkCopyMemoryToImage), and Windows finds vulkan-1.dll in System32 before PATH.
      # The runner's System32 loader is older, so the SDK's loader replaces it, as a current GPU driver would.
      - name: Install the Vulkan loader
        if: runner.os == 'Windows'
        run: |
          sdk=$(cygpath -u "$VULKAN_SDK")/runtime/x64/vulkan-1.dll
          sys=/c/Windows/System32/vulkan-1.dll
          version() { powershell -NoProfile -Command "(Get-Item '$(cygpath -w "$1")').VersionInfo.FileVersion"; }
          echo "System32 before: $(version $sys 2>/dev/null || echo none)"
          cp -f "$sdk" "$sys"
          echo "System32 now:    $(version $sys)"
          test "$(version $sys)" = "$(version $sdk)"

      # The runner's MSVC STL needs a newer clang than the LLVM it ships, so a pinned one replaces it.
      - name: Install LLVM ${{ env.LLVM_VERSION }}
        if: runner.os == 'Windows'
        run: |
          choco upgrade llvm --version "$LLVM_VERSION" -y --no-progress
          found=$(clang++ --version | head -n 1)
          echo "$found"
          case "$found" in *"clang version $LLVM_VERSION"*) ;; *) echo "clang++ on PATH is not $LLVM_VERSION"; exit 1 ;; esac

      # clang++ finds the MSVC libraries and the Windows SDK through this environment.
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The key never matches exactly, so the newest cache is restored and a new one is saved when packages were built.
      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ github.run_id }}
          restore-keys: vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-

      # After msvc-dev-cmd, which points VCPKG_ROOT at the copy bundled with Visual Studio.
      - name: Set up vcpkg
        run: |
          root="$HOME/vcpkg"
          cache="$HOME/vcpkg-cache"
          git init "$root"
          git -C "$root" fetch --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_COMMIT"
          git -C "$root" checkout FETCH_HEAD
          mkdir -p "$cache"
          echo "VCPKG_CACHE_FILES=$(find "$cache" -type f | wc -l | tr -d ' ')" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$root/bootstrap-vcpkg.bat" -disableMetrics
            root=$(cygpath -m "$root")
            cache=$(cygpath -m "$cache")
          else
            "$root/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
          echo "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" >> "$GITHUB_ENV"

      - name: Configure ${{ matrix.debug }}
        run: cmake --preset ${{ matrix.debug }}

      - name: Build ${{ matrix.debug }}
        run: cmake --build --preset ${{ matrix.debug }}

      - name: Test ${{ matrix.debug }}
        run: ctest --preset ${{ matrix.debug }}

      # Release runs even when a debug step failed.
      - name: Configure ${{ matrix.release }}
        id: configure-release
        if: ${{ !cancelled() }}
        run: cmake --preset ${{ matrix.release }}

      - name: Build ${{ matrix.release }}
        id: build-release
        if: ${{ !cancelled() && steps.configure-release.outcome == 'success' }}
        run: cmake --build --preset ${{ matrix.release }}

      - name: Test ${{ matrix.release }}
        if: ${{ !cancelled() && steps.build-release.outcome == 'success' }}
        run: ctest --preset ${{ matrix.release }}

      # TEMPORARY probe of lavapipe (Mesa's CPU Vulkan driver) for the image tests. Removed before the PR is ready.
      - name: Restore Mesa cache
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/mesa
          key: mesa-26.3.0-c505fcc77e8f63a09d7ddac086591d2f542c0698d37fc9e3094685a34d0d9991

      # The runner's processes are elevated, and an elevated process's Vulkan loader ignores VK_DRIVER_FILES and
      # VK_LAYER_PATH, so the driver and the validation layer are registered instead.
      - name: Register lavapipe and the validation layer
        if: ${{ runner.os == 'Windows' && !cancelled() && steps.build-release.outcome == 'success' }}
        shell: pwsh
        run: |
          $mesa = Join-Path $HOME 'mesa'
          if (-not (Test-Path "$mesa/mesa.7z")) {
            New-Item -ItemType Directory -Force $mesa | Out-Null
            Invoke-WebRequest -Uri 'https://github.com/pal1000/mesa-dist-win/releases/download/26.3.0/mesa3d-26.3.0-release-msvc.7z' -OutFile "$mesa/mesa.7z"
          }
          $hash = (Get-FileHash "$mesa/mesa.7z" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'c505fcc77e8f63a09d7ddac086591d2f542c0698d37fc9e3094685a34d0d9991') { throw "mesa.7z SHA-256 is $hash" }
          if (Test-Path "$mesa/x") { Remove-Item -Recurse -Force "$mesa/x" }
          7z x -y "-o$mesa/x" "$mesa/mesa.7z" | Out-Null
          $icd = (Get-ChildItem -Recurse "$mesa/x" -Filter 'lvp_icd.x86_64.json' | Select-Object -First 1).FullName
          $layer = (Get-ChildItem -Recurse $env:VULKAN_SDK -Filter 'VkLayer_khronos_validation.json' | Select-Object -First 1).FullName
          New-Item -Path 'HKLM:\SOFTWARE\Khronos\Vulkan\Drivers' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Khronos\Vulkan\Drivers' -Name $icd -Value 0 -PropertyType DWord -Force | Out-Null
          New-Item -Path 'HKLM:\SOFTWARE\Khronos\Vulkan\ExplicitLayers' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Khronos\Vulkan\ExplicitLayers' -Name $layer -Value 0 -PropertyType DWord -Force | Out-Null
          Write-Output "Registered $icd and $layer"

      - name: Probe lavapipe
        if: ${{ runner.os == 'Windows' && !cancelled() && steps.build-release.outcome == 'success' }}
        timeout-minutes: 40
        env:
          LP_NATIVE_VECTOR_WIDTH: 256
        run: |
          mkdir -p probe
          python tools/image_tests.py --lavapipe --fetch-only
          cdb="/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe"
          echo "PROBE cdb: $(test -f "$cdb" && echo yes || echo no)"
          for t in $(build/x64-release/tests/rasm_image_tests.exe --list | tr -d '\r'); do
            s=$(date +%s); rc=0
            build/x64-release/tests/rasm_image_tests.exe --update --golden-dir probe/g1 --scenes $t > probe/$t.log 2>&1 || rc=$?
            echo "PROBE scene $t rc=$rc seconds=$(( $(date +%s) - s )) $(grep -E "^$t " probe/$t.log | tr -d '\r' || true)"
          done
          if [ -f "$cdb" ]; then
            curl -sSfL -o dbg.7z https://github.com/pal1000/mesa-dist-win/releases/download/26.3.0/mesa3d-26.3.0-debug-info-msvc.7z
            echo "2f491276af43f69c22608af4ecce844fbc5c37ca5cb7c5dd520e92839adad756  dbg.7z" | sha256sum -c -
            7z x -y -odbg dbg.7z > /dev/null
            pdb=$(dirname "$(find dbg -iname 'vulkan_lvp.pdb' | head -n 1)")
            echo "PROBE pdb dir: $pdb"
            "$cdb" -g -G -lines -y "build/x64-debug/tests;build/x64-debug/src;$(cygpath -w "$pdb")" -c ".exr -1; r; u @rip-0x30 L24; ~*kn 40; q" build/x64-debug/tests/rasm_image_tests.exe --update --golden-dir probe/dbg --scenes alpha_modes > probe/cdb.log 2>&1 || true
            grep -vE "\] \[info\]|^\s+(name|driver version):|NatVis|ModLoad" probe/cdb.log | tail -n 400
          fi

      - name: Upload the probe images
        if: ${{ runner.os == 'Windows' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lavapipe-probe
          path: probe/
          if-no-files-found: ignore

      - name: Check for new vcpkg packages
        id: vcpkg-packages
        if: ${{ !cancelled() }}
        run: |
          count=$(find "$HOME/vcpkg-cache" -type f | wc -l | tr -d ' ')
          if [ "$count" != "$VCPKG_CACHE_FILES" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Save vcpkg cache
        if: ${{ !cancelled() && steps.vcpkg-packages.outputs.changed == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
