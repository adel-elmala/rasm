<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 792 332" width="792" height="332" role="img" aria-label="17_streaming, 6000 frames: 3045 tiles made. The share of each pool in use stays flat, between 15 and 36 percent. A pool that never frees would be full after about 210 tiles."><style>:root { --bg:           #fbfaf7;
    --bg-soft:      #f3f1eb;
    --bg-code:      #f0eee8;
    --bg-raised:    #ffffff;
    --fg:           #1d1d1b;
    --fg-soft:      #55534d;
    --fg-faint:     #8a877e;
    --line:         #dcd8ce;
    --link:         #1f5fbf;
    --accent:       #c2410c;
    --accent-fill:  #fde3d3;

    /* the color code shared by every diagram */
    --cpu:          #2563eb;   --cpu-fill:     #dbe7fd;
    --gpu:          #15803d;   --gpu-fill:     #d5f0dd;
    --mem:          #b45309;   --mem-fill:     #fbe8c8;
    --shader:       #7c3aed;   --shader-fill:  #e9defd;
    --muted-fill:   #ebe8e0;

    /* right / wrong, light rays, shadowed areas */
    --ok:           #0f7b6c;   --ok-fill:      #d3efe9;
    --bad:          #b91c1c;   --bad-fill:     #fbdcdc;
    --light:        #b8860b;   --light-fill:   #fdf0b5;
    --shade:        rgba(29, 29, 27, 0.4);

    --note:         #2563eb;
    --warn:         #b45309;
    --rule:         #b91c1c;

    /* syntax highlighting */
    --tok-kw:       #a626a4;
    --tok-type:     #0e7490;
    --tok-fn:       #1f5fbf;
    --tok-str:      #3f7d20;
    --tok-num:      #b45309;
    --tok-const:    #9a5b00;
    --tok-com:      #8a877e;
    --tok-pre:      #c2410c;
    --tok-ns:       #6b6860;

    --shadow:       0 1px 2px rgba(40, 30, 10, 0.06), 0 6px 20px rgba(40, 30, 10, 0.06);
    --radius:       10px;
    --sidebar:      280px;
    --toc:          230px;
    --content:      860px;
    --mono:         "JetBrains Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
    --sans:         "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; }
