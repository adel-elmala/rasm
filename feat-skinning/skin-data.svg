<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 792 452" width="792" height="452" role="img" aria-label="Import: JOINTS_0 and WEIGHTS_0 become a 16-byte SkinVertex per vertex, four 16-bit joints and four 16-bit weights that add up to 65535, in the geometry pool's skin stream; the skin's joints and inverse bind matrices and one sphere per joint go to the animation pool. Each frame the Animate pass writes per entity the joint matrices into this slot's joint buffer and, per skinned sub-mesh, an InstanceTransform with the entity's matrix, the posed bounds, the first skinned vertex and the motion flag. The Skin pass, a group per entity row and 64 vertices, reads the base vertex, its SkinVertex and four joint matrices, and writes a posed 64-byte vertex to this slot's skinned vertex buffer. The views read it through getVertex, and the other slot's through getPreviousObjectPosition."><style>:root { --bg:           #fbfaf7;
    --bg-soft:      #f3f1eb;
    --bg-code:      #f0eee8;
    --bg-raised:    #ffffff;
    --fg:           #1d1d1b;
    --fg-soft:      #55534d;
    --fg-faint:     #8a877e;
    --line:         #dcd8ce;
    --link:         #1f5fbf;
    --accent:       #c2410c;
    --accent-fill:  #fde3d3;

    /* the color code shared by every diagram */
    --cpu:          #2563eb;   --cpu-fill:     #dbe7fd;
    --gpu:          #15803d;   --gpu-fill:     #d5f0dd;
    --mem:          #b45309;   --mem-fill:     #fbe8c8;
    --shader:       #7c3aed;   --shader-fill:  #e9defd;
    --muted-fill:   #ebe8e0;

    /* right / wrong, light rays, shadowed areas */
    --ok:           #0f7b6c;   --ok-fill:      #d3efe9;
    --bad:          #b91c1c;   --bad-fill:     #fbdcdc;
    --light:        #b8860b;   --light-fill:   #fdf0b5;
    --shade:        rgba(29, 29, 27, 0.4);

    --note:         #2563eb;
    --warn:         #b45309;
    --rule:         #b91c1c;

    /* syntax highlighting */
    --tok-kw:       #a626a4;
    --tok-type:     #0e7490;
    --tok-fn:       #1f5fbf;
    --tok-str:      #3f7d20;
    --tok-num:      #b45309;
    --tok-const:    #9a5b00;
    --tok-com:      #8a877e;
    --tok-pre:      #c2410c;
    --tok-ns:       #6b6860;

    --shadow:       0 1px 2px rgba(40, 30, 10, 0.06), 0 6px 20px rgba(40, 30, 10, 0.06);
    --radius:       10px;
    --sidebar:      280px;
    --toc:          230px;
    --content:      860px;
    --mono:         "JetBrains Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
    --sans:         "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; }
@media (prefers-color-scheme: dark) { :root { --bg:           #15161a;
        --bg-soft:      #1c1e23;
        --bg-code:      #22252b;
        --bg-raised:    #1f2228;
        --fg:           #e8e6e1;
        --fg-soft:      #b3b0a8;
        --fg-faint:     #7f7d77;
        --line:         #33363d;
        --link:         #7fb0ff;
        --accent:       #fb923c;
        --accent-fill:  #40260f;
        --cpu:          #7fa8ff;   --cpu-fill:     #1c2a47;
        --gpu:          #5fd08a;   --gpu-fill:     #173326;
        --mem:          #f0b45a;   --mem-fill:     #3a2a12;
        --shader:       #b794ff;   --shader-fill:  #2c2147;
        --muted-fill:   #2a2c32;
        --ok:           #4fd1b8;   --ok-fill:      #12332e;
        --bad:          #f87171;   --bad-fill:     #401a1a;
        --light:        #f5cf4a;   --light-fill:   #3a3110;
        --shade:        rgba(0, 0, 0, 0.55);
        --note:         #7fa8ff;
        --warn:         #f0b45a;
        --rule:         #f87171;
        --tok-kw:       #c678dd;
        --tok-type:     #56b6c2;
        --tok-fn:       #61afef;
        --tok-str:      #98c379;
        --tok-num:      #d19a66;
        --tok-const:    #e5c07b;
        --tok-com:      #7f848e;
        --tok-pre:      #e06c75;
        --tok-ns:       #9da5b4;
        --shadow:       0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.25); } }
svg { font-family: var(--sans); }
svg { font-family: var(--sans); font-size: 13px; }
svg text { fill: var(--fg); }
svg text.small { font-size: 11px; fill: var(--fg-soft); }
svg text.title { font-weight: 700; }
svg text.big { font-size: 16px; font-weight: 700; }
svg text.mono { font-family: var(--mono); font-size: 12px; }
svg text.mid { text-anchor: middle; }
svg text.end { text-anchor: end; }
svg text.halo { paint-order: stroke; stroke: var(--bg-raised); stroke-width: 4px; stroke-linejoin: round; }
svg .box     { fill: var(--muted-fill);  stroke: var(--fg-faint); stroke-width: 1.5; }
svg .cpu     { fill: var(--cpu-fill);    stroke: var(--cpu);      stroke-width: 1.5; }
svg .gpu     { fill: var(--gpu-fill);    stroke: var(--gpu);      stroke-width: 1.5; }
svg .mem     { fill: var(--mem-fill);    stroke: var(--mem);      stroke-width: 1.5; }
svg .shader  { fill: var(--shader-fill); stroke: var(--shader);   stroke-width: 1.5; }
svg .ghost   { fill: none; stroke: var(--fg-faint); stroke-width: 1.2; stroke-dasharray: 5 4; }
svg .hot     { fill: none; stroke: var(--accent); stroke-width: 2.5; }
svg .zone    { fill: var(--bg-soft); stroke: var(--line); stroke-width: 1; }
svg .accent  { fill: var(--accent-fill); stroke: var(--accent);   stroke-width: 1.5; }
svg .ok      { fill: var(--ok-fill);     stroke: var(--ok);       stroke-width: 1.5; }
svg .bad     { fill: var(--bad-fill);    stroke: var(--bad);      stroke-width: 1.5; }
svg .light   { fill: var(--light-fill);  stroke: var(--light);    stroke-width: 1.5; }
svg .shade   { fill: var(--shade);       stroke: none; }
svg .lit     { fill: var(--light-fill);  stroke: none; }
svg .solid   { fill: var(--fg-faint);    stroke: var(--fg-soft);  stroke-width: 1.5; }
svg .paper   { fill: var(--bg-raised);   stroke: var(--line);     stroke-width: 1; }
svg .surface { fill: none; stroke: var(--fg); stroke-width: 3; stroke-linecap: round; }
svg .grid    { fill: none; stroke: var(--line); stroke-width: 1; }
svg .thick   { stroke-width: 3; }
svg .thin    { stroke-width: 1; }
svg .nofill  { fill: none; }
svg .o-25    { opacity: 0.25; }
svg .o-50    { opacity: 0.5; }
svg .o-75    { opacity: 0.75; }
svg .badge   { fill: var(--accent); stroke: none; }
svg text.badge-n { fill: var(--bg-raised); font-size: 12px; font-weight: 700; text-anchor: middle; }
svg .arrow        { fill: none; stroke: var(--fg-soft); stroke-width: 1.6; }
svg .arrow.cpu    { stroke: var(--cpu); fill: none; }
svg .arrow.gpu    { stroke: var(--gpu); fill: none; }
svg .arrow.mem    { stroke: var(--mem); fill: none; }
svg .arrow.shader { stroke: var(--shader); fill: none; }
svg .arrow.hot    { stroke: var(--accent); fill: none; }
svg .arrow.ok     { stroke: var(--ok); fill: none; }
svg .arrow.bad    { stroke: var(--bad); fill: none; }
svg .arrow.light  { stroke: var(--light); fill: none; }
svg .arrow.thick  { stroke-width: 3; }
svg .dashed       { stroke-dasharray: 6 4; }
svg :where(line.dashed, path.dashed, rect.dashed, circle.dashed, polygon.dashed, polyline.dashed) { stroke: var(--fg-faint); fill: none; }
svg .flowing { stroke-dasharray: 6 5; animation: flowing 1.2s linear infinite; }
@keyframes flowing { to { stroke-dashoffset: -22; } }
svg .head         { fill: var(--fg-soft); }
svg .head.cpu     { fill: var(--cpu); stroke: none; }
svg .head.gpu     { fill: var(--gpu); stroke: none; }
svg .head.mem     { fill: var(--mem); stroke: none; }
svg .head.shader  { fill: var(--shader); stroke: none; }
svg .head.hot     { fill: var(--accent); stroke: none; }
svg .head.ok      { fill: var(--ok); stroke: none; }
svg .head.bad     { fill: var(--bad); stroke: none; }
svg .head.light   { fill: var(--light); stroke: none; }
svg .t-cpu,    svg text.t-cpu    { fill: var(--cpu); }
svg .t-gpu,    svg text.t-gpu    { fill: var(--gpu); }
svg .t-mem,    svg text.t-mem    { fill: var(--mem); }
svg .t-shader, svg text.t-shader { fill: var(--shader); }
svg .t-hot,    svg text.t-hot    { fill: var(--accent); }
svg .t-ok,     svg text.t-ok     { fill: var(--ok); }
svg .t-bad,    svg text.t-bad    { fill: var(--bad); }
svg .t-light,  svg text.t-light  { fill: var(--light); }
svg .t-faint,  svg text.t-faint  { fill: var(--fg-faint); }
svg a:hover rect, svg a:hover circle { stroke-width: 2.5; }
svg a:hover text { text-decoration: underline; }
svg .handle { fill: var(--accent); stroke: var(--bg-raised); stroke-width: 2.5; cursor: grab; touch-action: none; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35)); }
svg .handle:hover, svg .handle:focus-visible { stroke: var(--fg); outline: none; }
svg .handle.dragging { cursor: grabbing; }
svg .pick { cursor: pointer; }
svg .pick:hover, svg .pick:focus-visible { stroke-width: 3; outline: none; }
svg g.pick:hover > :is(rect, circle, polygon), svg g.pick:focus-visible > :is(rect, circle, polygon) { stroke-width: 3; }
svg g.pick text { pointer-events: none; }
svg .off { opacity: 0.28; }
svg .hide { display: none; }
.card { fill: var(--bg-raised); stroke: var(--line); stroke-width: 1; }</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="ah-cpu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head cpu"/></marker><marker id="ah-gpu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head gpu"/></marker><marker id="ah-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head mem"/></marker><marker id="ah-shader" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head shader"/></marker><marker id="ah-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head hot"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head ok"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head bad"/></marker><marker id="ah-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head light"/></marker></defs><rect class="card" x="-15.5" y="-15.5" width="791" height="451" rx="12"/>
    <text x="20" y="22" class="title t-cpu">Import, once per mesh</text>
    <rect x="20" y="34" width="200" height="40" rx="6" class="cpu"/>
    <text x="120" y="52" class="mid mono small">JOINTS_n · WEIGHTS_n</text>
    <text x="120" y="67" class="mid small">4 largest, scaled to 1</text>
    <line x1="220" y1="54" x2="258" y2="54" class="arrow cpu" marker-end="url(#ah-cpu)"/>
    <rect x="260" y="34" width="232" height="40" rx="6" class="mem"/>
    <text x="376" y="52" class="mid small">skin stream, 16 B per vertex, read by Skin</text>
    <text x="376" y="67" class="mid mono small">4 × u16 joints · 4 × unorm16</text>
    <rect x="510" y="34" width="230" height="40" rx="6" class="mem"/>
    <text x="625" y="52" class="mid small">animation pool</text>
    <text x="625" y="67" class="mid small">joints · inverse binds · spheres</text>

    <text x="20" y="108" class="title t-gpu">Animate: a group per entity row</text>
    <rect x="20" y="118" width="720" height="58" rx="6" class="gpu"/>
    <circle cx="44" cy="147" r="10" class="badge"/><text x="44" y="151" class="badge-n">1</text>
    <text x="62" y="143" class="small">nodes: local → world</text>
    <text x="62" y="158" class="small">(node animation)</text>
    <circle cx="234" cy="147" r="10" class="badge"/><text x="234" y="151" class="badge-n">2</text>
    <text x="252" y="143" class="small">per joint: world ·</text>
    <text x="252" y="158" class="small">inverseBind → joints</text>
    <circle cx="424" cy="147" r="10" class="badge"/><text x="424" y="151" class="badge-n">3</text>
    <text x="442" y="143" class="small">per skinned sub-mesh: InstanceTransform</text>
    <text x="442" y="158" class="small">entity matrix, bounds, skinnedVertex</text>
    <line x1="625" y1="74" x2="625" y2="116" class="arrow mem" marker-end="url(#ah-mem)"/>

    <rect x="20" y="200" width="230" height="40" rx="6" class="mem"/>
    <text x="135" y="218" class="mid small">Joint Matrix Buffer (slot)</text>
    <text x="135" y="233" class="mid small">48 B per joint per entity</text>
    <rect x="510" y="200" width="230" height="40" rx="6" class="mem"/>
    <text x="625" y="218" class="mid small">Animated Transform Buffer</text>
    <text x="625" y="233" class="mid small">bounds read by every Cull</text>
    <line x1="135" y1="176" x2="135" y2="198" class="arrow gpu" marker-end="url(#ah-gpu)"/>
    <line x1="625" y1="176" x2="625" y2="198" class="arrow gpu" marker-end="url(#ah-gpu)"/>

    <text x="160" y="272" class="title t-gpu">Skin: x = entity row, y = its next 64 vertices</text>
    <rect x="20" y="282" width="480" height="44" rx="6" class="gpu"/>
    <text x="34" y="300" class="small">M = Σ wᵢ · joints[first + jointᵢ]; position by M, normal by its</text>
    <text x="34" y="316" class="small">cofactors, tangent by M's 3 × 3; UVs copied</text>
    <line x1="135" y1="240" x2="135" y2="280" class="arrow mem" marker-end="url(#ah-mem)"/>
    <rect x="520" y="282" width="220" height="44" rx="6" class="mem"/>
    <text x="630" y="300" class="mid small">Skinned Vertex Buffer</text>
    <text x="630" y="316" class="mid small">64 B per vertex, one per slot</text>
    <line x1="500" y1="304" x2="518" y2="304" class="arrow gpu" marker-end="url(#ah-gpu)"/>

    <line x1="630" y1="326" x2="630" y2="356" class="arrow mem" marker-end="url(#ah-mem)"/>
    <rect x="20" y="358" width="720" height="50" rx="6" class="cpu"/>
    <text x="34" y="378" class="small">every view: camera, cascades, spot maps, cube faces</text>
    <text x="34" y="396" class="mono small">getVertex · getPreviousObjectPosition · getWorldSphere</text>
  </svg>
