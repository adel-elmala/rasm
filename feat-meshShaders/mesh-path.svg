<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 792 367" width="792" height="367" role="img" aria-label="The mesh-shader path. The cull pass runs countMain and writeMain, which write chunks of 64 meshlets and the run's group counts. The draw pass calls drawMeshTasksIndirect on those counts: each taskMain workgroup tests the 64 meshlets of one chunk, writes the visible lanes in order into its payload and launches that many meshMain workgroups. Each meshMain workgroup reads its meshlet's vertex list and packed triangles from the meshlet data stream and writes up to 64 vertices and 124 triangles to the rasterizer."><style>:root { --bg:           #fbfaf7;
    --bg-soft:      #f3f1eb;
    --bg-code:      #f0eee8;
    --bg-raised:    #ffffff;
    --fg:           #1d1d1b;
    --fg-soft:      #55534d;
    --fg-faint:     #8a877e;
    --line:         #dcd8ce;
    --link:         #1f5fbf;
    --accent:       #c2410c;
    --accent-fill:  #fde3d3;

    /* the color code shared by every diagram */
    --cpu:          #2563eb;   --cpu-fill:     #dbe7fd;
    --gpu:          #15803d;   --gpu-fill:     #d5f0dd;
    --mem:          #b45309;   --mem-fill:     #fbe8c8;
    --shader:       #7c3aed;   --shader-fill:  #e9defd;
    --muted-fill:   #ebe8e0;

    /* right / wrong, light rays, shadowed areas */
    --ok:           #0f7b6c;   --ok-fill:      #d3efe9;
    --bad:          #b91c1c;   --bad-fill:     #fbdcdc;
    --light:        #b8860b;   --light-fill:   #fdf0b5;
    --shade:        rgba(29, 29, 27, 0.4);

    --note:         #2563eb;
    --warn:         #b45309;
    --rule:         #b91c1c;

    /* syntax highlighting */
    --tok-kw:       #a626a4;
    --tok-type:     #0e7490;
    --tok-fn:       #1f5fbf;
    --tok-str:      #3f7d20;
    --tok-num:      #b45309;
    --tok-const:    #9a5b00;
    --tok-com:      #8a877e;
    --tok-pre:      #c2410c;
    --tok-ns:       #6b6860;

    --shadow:       0 1px 2px rgba(40, 30, 10, 0.06), 0 6px 20px rgba(40, 30, 10, 0.06);
    --radius:       10px;
    --sidebar:      280px;
    --toc:          230px;
    --content:      860px;
    --mono:         "JetBrains Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
    --sans:         "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; }
@media (prefers-color-scheme: dark) { :root { --bg:           #15161a;
        --bg-soft:      #1c1e23;
        --bg-code:      #22252b;
        --bg-raised:    #1f2228;
        --fg:           #e8e6e1;
        --fg-soft:      #b3b0a8;
        --fg-faint:     #7f7d77;
        --line:         #33363d;
        --link:         #7fb0ff;
        --accent:       #fb923c;
        --accent-fill:  #40260f;
        --cpu:          #7fa8ff;   --cpu-fill:     #1c2a47;
        --gpu:          #5fd08a;   --gpu-fill:     #173326;
        --mem:          #f0b45a;   --mem-fill:     #3a2a12;
        --shader:       #b794ff;   --shader-fill:  #2c2147;
        --muted-fill:   #2a2c32;
        --ok:           #4fd1b8;   --ok-fill:      #12332e;
        --bad:          #f87171;   --bad-fill:     #401a1a;
        --light:        #f5cf4a;   --light-fill:   #3a3110;
        --shade:        rgba(0, 0, 0, 0.55);
        --note:         #7fa8ff;
        --warn:         #f0b45a;
        --rule:         #f87171;
        --tok-kw:       #c678dd;
        --tok-type:     #56b6c2;
        --tok-fn:       #61afef;
        --tok-str:      #98c379;
        --tok-num:      #d19a66;
        --tok-const:    #e5c07b;
        --tok-com:      #7f848e;
        --tok-pre:      #e06c75;
        --tok-ns:       #9da5b4;
        --shadow:       0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.25); } }
svg { font-family: var(--sans); }
svg { font-family: var(--sans); font-size: 13px; }
svg text { fill: var(--fg); }
svg text.small { font-size: 11px; fill: var(--fg-soft); }
svg text.title { font-weight: 700; }
svg text.big { font-size: 16px; font-weight: 700; }
svg text.mono { font-family: var(--mono); font-size: 12px; }
svg text.mid { text-anchor: middle; }
svg text.end { text-anchor: end; }
svg text.halo { paint-order: stroke; stroke: var(--bg-raised); stroke-width: 4px; stroke-linejoin: round; }
svg .box     { fill: var(--muted-fill);  stroke: var(--fg-faint); stroke-width: 1.5; }
svg .cpu     { fill: var(--cpu-fill);    stroke: var(--cpu);      stroke-width: 1.5; }
svg .gpu     { fill: var(--gpu-fill);    stroke: var(--gpu);      stroke-width: 1.5; }
svg .mem     { fill: var(--mem-fill);    stroke: var(--mem);      stroke-width: 1.5; }
svg .shader  { fill: var(--shader-fill); stroke: var(--shader);   stroke-width: 1.5; }
svg .ghost   { fill: none; stroke: var(--fg-faint); stroke-width: 1.2; stroke-dasharray: 5 4; }
svg .hot     { fill: none; stroke: var(--accent); stroke-width: 2.5; }
svg .zone    { fill: var(--bg-soft); stroke: var(--line); stroke-width: 1; }
svg .accent  { fill: var(--accent-fill); stroke: var(--accent);   stroke-width: 1.5; }
svg .ok      { fill: var(--ok-fill);     stroke: var(--ok);       stroke-width: 1.5; }
svg .bad     { fill: var(--bad-fill);    stroke: var(--bad);      stroke-width: 1.5; }
svg .light   { fill: var(--light-fill);  stroke: var(--light);    stroke-width: 1.5; }
svg .shade   { fill: var(--shade);       stroke: none; }
svg .lit     { fill: var(--light-fill);  stroke: none; }
svg .solid   { fill: var(--fg-faint);    stroke: var(--fg-soft);  stroke-width: 1.5; }
svg .paper   { fill: var(--bg-raised);   stroke: var(--line);     stroke-width: 1; }
svg .surface { fill: none; stroke: var(--fg); stroke-width: 3; stroke-linecap: round; }
svg .grid    { fill: none; stroke: var(--line); stroke-width: 1; }
svg .thick   { stroke-width: 3; }
svg .thin    { stroke-width: 1; }
svg .nofill  { fill: none; }
svg .o-25    { opacity: 0.25; }
svg .o-50    { opacity: 0.5; }
svg .o-75    { opacity: 0.75; }
svg .badge   { fill: var(--accent); stroke: none; }
svg text.badge-n { fill: var(--bg-raised); font-size: 12px; font-weight: 700; text-anchor: middle; }
svg .arrow        { fill: none; stroke: var(--fg-soft); stroke-width: 1.6; }
svg .arrow.cpu    { stroke: var(--cpu); fill: none; }
svg .arrow.gpu    { stroke: var(--gpu); fill: none; }
svg .arrow.mem    { stroke: var(--mem); fill: none; }
svg .arrow.shader { stroke: var(--shader); fill: none; }
svg .arrow.hot    { stroke: var(--accent); fill: none; }
svg .arrow.ok     { stroke: var(--ok); fill: none; }
svg .arrow.bad    { stroke: var(--bad); fill: none; }
svg .arrow.light  { stroke: var(--light); fill: none; }
svg .arrow.thick  { stroke-width: 3; }
svg .dashed       { stroke-dasharray: 6 4; }
svg :where(line.dashed, path.dashed, rect.dashed, circle.dashed, polygon.dashed, polyline.dashed) { stroke: var(--fg-faint); fill: none; }
svg .flowing { stroke-dasharray: 6 5; animation: flowing 1.2s linear infinite; }
@keyframes flowing { to { stroke-dashoffset: -22; } }
svg .head         { fill: var(--fg-soft); }
svg .head.cpu     { fill: var(--cpu); stroke: none; }
svg .head.gpu     { fill: var(--gpu); stroke: none; }
svg .head.mem     { fill: var(--mem); stroke: none; }
svg .head.shader  { fill: var(--shader); stroke: none; }
svg .head.hot     { fill: var(--accent); stroke: none; }
svg .head.ok      { fill: var(--ok); stroke: none; }
svg .head.bad     { fill: var(--bad); stroke: none; }
svg .head.light   { fill: var(--light); stroke: none; }
svg .t-cpu,    svg text.t-cpu    { fill: var(--cpu); }
svg .t-gpu,    svg text.t-gpu    { fill: var(--gpu); }
svg .t-mem,    svg text.t-mem    { fill: var(--mem); }
svg .t-shader, svg text.t-shader { fill: var(--shader); }
svg .t-hot,    svg text.t-hot    { fill: var(--accent); }
svg .t-ok,     svg text.t-ok     { fill: var(--ok); }
svg .t-bad,    svg text.t-bad    { fill: var(--bad); }
svg .t-light,  svg text.t-light  { fill: var(--light); }
svg .t-faint,  svg text.t-faint  { fill: var(--fg-faint); }
svg a:hover rect, svg a:hover circle { stroke-width: 2.5; }
svg a:hover text { text-decoration: underline; }
svg .handle { fill: var(--accent); stroke: var(--bg-raised); stroke-width: 2.5; cursor: grab; touch-action: none; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35)); }
svg .handle:hover, svg .handle:focus-visible { stroke: var(--fg); outline: none; }
svg .handle.dragging { cursor: grabbing; }
svg .pick { cursor: pointer; }
svg .pick:hover, svg .pick:focus-visible { stroke-width: 3; outline: none; }
svg g.pick:hover > :is(rect, circle, polygon), svg g.pick:focus-visible > :is(rect, circle, polygon) { stroke-width: 3; }
svg g.pick text { pointer-events: none; }
svg .off { opacity: 0.28; }
svg .hide { display: none; }
.card { fill: var(--bg-raised); stroke: var(--line); stroke-width: 1; }</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="ah-cpu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head cpu"/></marker><marker id="ah-gpu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head gpu"/></marker><marker id="ah-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head mem"/></marker><marker id="ah-shader" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head shader"/></marker><marker id="ah-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head hot"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head ok"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head bad"/></marker><marker id="ah-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head light"/></marker></defs><rect class="card" x="-15.5" y="-15.5" width="791" height="366" rx="12"/>
    <text x="20" y="22" class="title t-gpu">Cull pass (compute)</text>
    <rect x="20" y="36" width="150" height="44" rx="22" class="shader"/>
    <text x="95" y="63" class="mid mono">countMain</text>
    <line x1="170" y1="58" x2="196" y2="58" class="arrow" marker-end="url(#ah)"/>
    <rect x="198" y="36" width="150" height="44" rx="22" class="shader"/>
    <text x="273" y="63" class="mid mono">writeMain</text>
    <line x1="348" y1="58" x2="388" y2="58" class="arrow mem" marker-end="url(#ah-mem)"/>
    <rect x="390" y="38" width="170" height="40" rx="4" class="mem"/>
    <text x="475" y="63" class="mid small">chunks of 64 meshlets</text>
    <rect x="570" y="38" width="170" height="40" rx="4" class="mem o-75"/>
    <text x="655" y="63" class="mid small">group counts per run</text>

    <text x="20" y="116" class="title t-gpu">Draw pass (graphics), per run</text>
    <line x1="655" y1="78" x2="655" y2="118" class="arrow mem" marker-end="url(#ah-mem)"/>
    <text x="740" y="136" class="end mono small">drawMeshTasksIndirect(group counts)</text>
    <rect x="20" y="150" width="190" height="66" rx="8" class="shader"/>
    <text x="115" y="172" class="mid mono">taskMain</text>
    <text x="115" y="190" class="mid small">a workgroup per chunk:</text>
    <text x="115" y="206" class="mid small">64 threads, 64 meshlets</text>
    <line x1="430" y1="78" x2="170" y2="148" class="arrow mem dashed" marker-end="url(#ah-mem)"/>
    <line x1="210" y1="183" x2="248" y2="183" class="arrow shader" marker-end="url(#ah-shader)"/>
    <rect x="250" y="156" width="170" height="54" rx="4" class="mem o-75"/>
    <text x="335" y="178" class="mid small">payload: the chunk,</text>
    <text x="335" y="196" class="mid small">visible lanes in order</text>
    <line x1="420" y1="170" x2="470" y2="154" class="arrow shader" marker-end="url(#ah-shader)"/>
    <line x1="420" y1="183" x2="470" y2="183" class="arrow shader" marker-end="url(#ah-shader)"/>
    <line x1="420" y1="196" x2="470" y2="212" class="arrow shader" marker-end="url(#ah-shader)"/>
    <rect x="472" y="140" width="130" height="26" rx="5" class="shader"/>
    <text x="537" y="158" class="mid mono small">meshMain</text>
    <rect x="472" y="170" width="130" height="26" rx="5" class="shader"/>
    <text x="537" y="188" class="mid mono small">meshMain</text>
    <rect x="472" y="200" width="130" height="26" rx="5" class="shader"/>
    <text x="537" y="218" class="mid mono small">meshMain</text>
    <line x1="602" y1="183" x2="640" y2="183" class="arrow gpu" marker-end="url(#ah-gpu)"/>
    <rect x="642" y="160" width="98" height="46" rx="6" class="gpu"/>
    <text x="691" y="188" class="mid small">rasterizer</text>
    <text x="537" y="244" class="mid small">one per visible meshlet</text>

    <text x="20" y="282" class="title t-mem">One meshlet in the meshlet data stream (32-bit words)</text>
    <rect x="20" y="294" width="34" height="28" class="mem"/><text x="37" y="313" class="mid small">v0</text>
    <rect x="54" y="294" width="34" height="28" class="mem"/><text x="71" y="313" class="mid small">v1</text>
    <rect x="88" y="294" width="34" height="28" class="mem"/><text x="105" y="313" class="mid small">…</text>
    <rect x="122" y="294" width="58" height="28" class="mem"/><text x="151" y="313" class="mid small">v(n−1)</text>
    <rect x="190" y="294" width="130" height="28" class="mem o-75"/><text x="255" y="313" class="mid small">t0: a | b | c | 0</text>
    <rect x="320" y="294" width="130" height="28" class="mem o-75"/><text x="385" y="313" class="mid small">t1: a | b | c | 0</text>
    <rect x="450" y="294" width="60" height="28" class="mem o-75"/><text x="480" y="313" class="mid small">…</text>
    <text x="520" y="306" class="small">n ≤ 64 sub-mesh vertex numbers,</text>
    <text x="520" y="322" class="small">then a word per triangle (bytes)</text>
  </svg>