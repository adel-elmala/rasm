    <text x="589" y="132" class="mid small">the slot's targets: picks side by side</text>
    <rect x="446" y="142" width="40" height="30" class="gpu o-50"/><rect x="486" y="142" width="96" height="30" class="gpu o-25"/><rect x="582" y="142" width="20" height="30" class="gpu o-50"/>
    <text x="680" y="162" class="mid small">ids, positions</text>
