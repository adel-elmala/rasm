    <line x1="597" y1="126" x2="513" y2="126" class="arrow mem" marker-end="url(#ah-mem)"/>
    <line x1="290" y1="66" x2="380" y2="101" class="arrow mem" marker-end="url(#ah-mem)"/>
    <rect x="200" y="112" width="110" height="40" rx="6" class="gpu"/><text x="255" y="136" class="mid small">window, then UI</text>
    <line x1="347" y1="133" x2="313" y2="133" class="arrow cpu" marker-end="url(#ah-cpu)"/>
