<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <!-- RASM PR diagram template. Colors are the tokens of docs/assets/style.css (light theme). Keep the solid background. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#55534d"/>
    </marker>
    <style>
      .title  { font-size: 20px; font-weight: 700; fill: #1d1d1b; }
      .label  { font-size: 13px; font-weight: 700; fill: #55534d; letter-spacing: .06em; }
      .box    { font-size: 14px; fill: #1d1d1b; }
      .small  { font-size: 12px; fill: #55534d; }
      .mono   { font-family: Cascadia Code, Consolas, ui-monospace, monospace; font-size: 12px; fill: #1d1d1b; }
      .flow   { stroke: #55534d; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .cpu    { fill: #dbe7fd; stroke: #2563eb; stroke-width: 1.5; }
      .gpu    { fill: #d5f0dd; stroke: #15803d; stroke-width: 1.5; }
      .mem    { fill: #fbe8c8; stroke: #b45309; stroke-width: 1.5; }
      .shader { fill: #e9defd; stroke: #7c3aed; stroke-width: 1.5; }
      .muted  { fill: #ebe8e0; stroke: #dcd8ce; stroke-width: 1.5; }
      .new    { fill: #fde3d3; stroke: #c2410c; stroke-width: 2; stroke-dasharray: 5 3; }
    </style>
  </defs>

  <rect width="960" height="400" rx="12" fill="#fbfaf7" stroke="#dcd8ce"/>
  <text x="32" y="44" class="title">Title: what changes, in a few words</text>

  <!-- TODAY -->
  <text x="32" y="92" class="label">TODAY</text>
  <rect x="32"  y="104" width="170" height="52" rx="8" class="gpu"/>
  <text x="117" y="135" class="box" text-anchor="middle">Cull 1</text>
  <rect x="242" y="104" width="170" height="52" rx="8" class="gpu"/>
  <text x="327" y="135" class="box" text-anchor="middle">Scene 1</text>
  <rect x="452" y="104" width="170" height="52" rx="8" class="mem"/>
  <text x="537" y="135" class="box" text-anchor="middle">HDR color</text>
  <path d="M202,130 H238" class="flow"/>
  <path d="M412,130 H448" class="flow"/>

  <!-- AFTER -->
  <text x="32" y="212" class="label">AFTER</text>
  <rect x="32"  y="224" width="170" height="52" rx="8" class="gpu"/>
  <text x="117" y="255" class="box" text-anchor="middle">Cull 1</text>
  <rect x="242" y="224" width="170" height="52" rx="8" class="gpu"/>
  <text x="327" y="255" class="box" text-anchor="middle">Scene 1</text>
  <rect x="452" y="224" width="170" height="52" rx="8" class="new"/>
  <text x="537" y="248" class="box" text-anchor="middle">New pass</text>
  <text x="537" y="266" class="small" text-anchor="middle">what it does</text>
  <rect x="662" y="224" width="170" height="52" rx="8" class="mem"/>
  <text x="747" y="255" class="box" text-anchor="middle">HDR color</text>
  <path d="M202,250 H238" class="flow"/>
  <path d="M412,250 H448" class="flow"/>
  <path d="M622,250 H658" class="flow"/>

  <!-- Legend -->
  <g transform="translate(32,330)">
    <rect width="16" height="16" rx="3" class="cpu"/>    <text x="24"  y="13" class="small">CPU</text>
    <rect x="80"  width="16" height="16" rx="3" class="gpu"/>    <text x="104" y="13" class="small">GPU pass</text>
    <rect x="200" width="16" height="16" rx="3" class="mem"/>    <text x="224" y="13" class="small">memory / target</text>
    <rect x="360" width="16" height="16" rx="3" class="shader"/> <text x="384" y="13" class="small">shader</text>
    <rect x="470" width="16" height="16" rx="3" class="new"/>    <text x="494" y="13" class="small">new in this PR</text>
  </g>
  <text x="32" y="378" class="mono">EngineConfig::field = value;   // one line of the API, when it helps</text>
</svg>
